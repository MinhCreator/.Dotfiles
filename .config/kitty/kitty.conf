# BEGIN_KITTY_THEME
# Everforest Dark Hard
include current-theme.conf
# END_KITTY_THEME

# BEGIN_KITTY_FONTS
font_family      family='Hurmit Nerd Font' postscript_name=HurmitNF-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

window_padding_width 5
tab_bar_style slant
enable_audio_bell no
notify_on_cmd_finish unfocused
remember_window_size no

enabled_layouts splits

map ctrl+shift+enter launch --location=hsplit --cwd=current
map ctrl+alt+enter launch --location=vsplit --cwd=current

map alt+h neighboring_window left
map alt+l neighboring_window right
map alt+k neighboring_window up
map alt+j neighboring_window down

map ctrl+alt+left resize_window narrower
map ctrl+alt+right resize_window wider
map ctrl+alt+up resize_window taller
map ctrl+alt+down resize_window shorter
map ctrl+shift+alt+left resize_window narrower 5
map ctrl+shift+alt+right resize_window wider 5
map ctrl+shift+alt+up resize_window taller 5
map ctrl+shift+alt+down resize_window shorter 5

map ctrl+shift+w close_window
