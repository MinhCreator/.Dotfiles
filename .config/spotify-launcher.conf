# native wayland, xwayland clicks get offset after pypr moves it
# basic password store so it stays logged in after reboot
# no gpu + no color manager or fullscreen vids go black / flip the acer into hdr. nvidia bs
[spotify]
extra_arguments = ["--enable-features=UseOzonePlatform", "--ozone-platform=wayland", "--password-store=basic", "--disable-features=WaylandWpColorManagerV1", "--disable-gpu"]
